; amdlss_dx12_dlss.ini, read once when the game starts. Plain key=value; lines starting with ; or # are comments.

; 0 turns the replacement off and the game's own upscaler runs.
enabled=1

; The jitter read from the game is multiplied by these before it goes to DLSS. Flip one to -1 if the image shimmers
; in a pattern that follows the sub-pixel jitter.
jitter_sign_x=1
jitter_sign_y=1

; Where the velocity-to-pixels scale comes from. game: TSR's own constant ScreenVelocityToInputPixelVelocity, read from its
; constant buffer every frame and negated (DLSS wants current to previous). ini: mv_scale_x / mv_scale_y below times the
; input viewport size, as a manual override.
mv_scale_source=game

; Used when mv_scale_source=ini: velocity becomes input pixels as (mv_scale_x * viewport width, mv_scale_y * viewport
; height). The defaults give "previous minus current, y down". Flip a sign if motion trails or ghosts go the wrong way.
mv_scale_x=-0.5
mv_scale_y=0.5

; The first 10 evaluations are always logged, then one every N frames (0 = only the first 10).
log_every_n_frames=300

; Length of the game's Halton(2,3) jitter cycle, used only if reading the jitter from the game fails.
jitter_cycle=8

; 1 fills u1, the half-size output TSR writes and the bloom / eye-adaptation chain reads, from the DLSS output.
; 0 leaves it unwritten (the old behaviour) for an A/B comparison.
fill_half_res=1

; 1: once DLSS has run, a frame whose inputs cannot be used (no depth of render size) still skips TSR and leaves u0
; holding the previous DLSS output, so TSR never runs on history that DLSS frames wrote. 0 lets TSR run on such
; frames; DLSS then resets its history on its next frame.
never_fallback_after_start=1

; 1: separate translucency (u4) is composited over the scene color (u3) before DLSS: rgb = scene.rgb * trans.a +
; trans.rgb (premultiplied, alpha = transmittance). 0 feeds u3 to DLSS raw.
composite_translucency=1

; How the velocity texture is decoded. gamma: what UE's TSR shader does, e = 4.008016 * enc - 2.003992 and then
; e * abs(e) * 0.5 (the unbias (enc - 32767/65535) / (0.499 * 0.5), divided by 2/1.4142, then sign(e) * e * e).
; linear: the unbias alone.
mv_encoding=gamma

; This file is re-read when its modification time changes (checked every 60 upscale dispatches), so any key above can
; be changed while the game runs. After a change DLSS resets its history on the next frame. enabled=0 hands the pass
; back to TSR at once, and enabled=1 resumes DLSS.
