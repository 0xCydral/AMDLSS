; amdlss_dx12_dlss.ini, read once when the game starts. Plain key=value; lines starting with ; or # are comments.

; 0 turns the replacement off and the game's own upscaler runs.
enabled=1

; The jitter read from the game is multiplied by these before it goes to DLSS. Flip one to -1 if the image shimmers
; in a pattern that follows the sub-pixel jitter.
jitter_sign_x=1
jitter_sign_y=1

; Motion vectors: UE velocity (NDC delta, y up) becomes render pixels as (mv_scale_x * render width, mv_scale_y * render
; height). The defaults give DLSS "previous minus current, y down". Flip a sign if motion trails or ghosts go the wrong way.
mv_scale_x=-0.5
mv_scale_y=0.5

; The first 10 evaluations are always logged, then one every N frames (0 = only the first 10).
log_every_n_frames=300

; Length of the game's Halton(2,3) jitter cycle, used only if reading the jitter from the game fails.
jitter_cycle=8
